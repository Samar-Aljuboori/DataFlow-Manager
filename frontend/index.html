<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DataFlow Manager</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="container">
      <section class="hero">
        <h1>DataFlow Manager</h1>
        <p>Upload, analyze and clean your data easily.</p>

        <!-- Upload Section -->
        <div class="upload-container">
          <input
            type="file"
            id="fileInput"
            accept=".csv, .xlsx, .xls"
            style="display: none"
          />
          <button type="button" id="uploadBtn" class="btn">Upload File</button>
        </div>

        <div id="statusMessage" class="status-message"></div>

        <!-- Analysis Dashboard Section: Dataset Summary Cards -->
        <div id="stats-dashboard" class="stats-grid" style="display: none">
          <div class="stat-card">
            <h4>Total Rows</h4>
            <p id="stat-rows">0</p>
          </div>
          <div class="stat-card">
            <h4>Total Columns</h4>
            <p id="stat-cols">0</p>
          </div>
          <div class="stat-card">
            <h4>Missing Values</h4>
            <p id="stat-missing">0</p>
          </div>
          <div class="stat-card">
            <h4>Duplicate Rows</h4>
            <p id="stat-duplicates">0</p>
          </div>
        </div>

        <!--  Data Cleaning UI Controls) -->
        <div
          id="cleaning-controls"
          class="cleaning-container"
          style="display: none"
        >
          <h3>Data Cleaning Options</h3>
          <div class="cleaning-buttons">
            <button
              type="button"
              id="removeDuplicatesBtn"
              class="btn btn-warning"
            >
              Remove Duplicates
            </button>
            <button type="button" id="removeMissingBtn" class="btn btn-danger">
              Remove Missing Values
            </button>

            <div class="fill-missing-group">
              <input
                type="text"
                id="fillValueInput"
                placeholder="Enter fill value..."
                class="cleaning-input"
              />
              <button type="button" id="fillMissingBtn" class="btn btn-success">
                Fill Missing Values
              </button>
            </div>
          </div>
        </div>

        <!--  Column Statistics UI -->
        <div
          id="stats-analysis-container"
          class="cleaning-container"
          style="display: none"
        >
          <h3>Column Statistics Analysis</h3>
          <div class="stats-select-group">
            <label for="columnSelect">Select Column:</label>
            <select id="columnSelect" class="cleaning-input">
              <option value="">-- Choose a Column --</option>
            </select>
          </div>

          <div
            id="column-stats-cards"
            class="stats-grid"
            style="display: none; margin-top: 15px"
          >
            <div class="stat-card">
              <h4>Mean</h4>
              <p id="stat-mean">-</p>
            </div>
            <div class="stat-card">
              <h4>Median</h4>
              <p id="stat-median">-</p>
            </div>
            <div class="stat-card">
              <h4>Minimum</h4>
              <p id="stat-min">-</p>
            </div>
            <div class="stat-card">
              <h4>Maximum</h4>
              <p id="stat-max">-</p>
            </div>
          </div>
        </div>
        <!-- Preview UI Section -->
        <div
          class="preview-container"
          id="previewContainer"
          style="display: none"
        >
          <h2 class="preview-title">Data Preview</h2>

          <!-- Real-Time Search Bar -->
          <div class="search-container">
            <input
              type="text"
              id="searchInput"
              placeholder="Search in table..."
              class="cleaning-input"
            />
          </div>

          <!-- Filter UI Controls  -->
          <div class="filter-controls">
            <select id="filterColumnSelect" class="cleaning-input">
              <option value="">-- Select Column --</option>
            </select>
            <input
              type="text"
              id="filterValueInput"
              placeholder="Value (e.g., IT)"
              class="cleaning-input"
            />
            <button type="button" id="applyFilterBtn" class="btn btn-primary">
              Filter
            </button>
            <button type="button" id="resetFilterBtn" class="btn btn-secondary">
              Reset
            </button>
          </div>

          <!-- Export UI Controls  -->
          <div class="export-controls">
            <button type="button" id="downloadCsvBtn" class="btn btn-secondary">
              Download CSV
            </button>
            <button type="button" id="downloadExcelBtn" class="btn btn-success">
              Download Excel
            </button>
          </div>

          <!-- Table Wrapper -->
          <div class="table-wrapper">
            <table id="previewTable">
              <thead id="tableHeader"></thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <script src="js/app.js"></script>
  </body>
</html>
