<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataFlow Manager</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container">
        <section class="hero">
            <h1>DataFlow Manager</h1>
            <p>Upload, analyze and clean your data easily.</p>
            
            <div class="upload-container">
                <input type="file" id="fileInput" accept=".csv, .xlsx, .xls" style="display: none;">
                <button id="uploadBtn" class="btn">Upload File</button>
            </div>
            
            <div id="statusMessage" class="status-message"></div>

            <!-- Preview UI Section (Added Here) -->
            <div class="preview-container" id="previewContainer">
                <h2 class="preview-title">Data Preview</h2>
                <div class="table-wrapper">
                    <table id="previewTable">
                        <thead id="tableHeader"></thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
